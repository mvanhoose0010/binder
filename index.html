<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retain Converter</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

h2{
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:220px;
    font-family:Consolas,monospace;
    font-size:14px;
    padding:10px;
    box-sizing:border-box;
    resize:vertical;
}

button{
    padding:10px 20px;
    margin:15px 5px 15px 0;
    cursor:pointer;
    font-size:15px;
}

#status{
    margin-bottom:15px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:left;
    font-size:14px;
}

th{
    background:#f0f0f0;
}
</style>

</head>
<body>

<h2>Retain Converter, paste in Placard order for proper conversion</h2>

<textarea id="input" placeholder="Paste copied data here..."></textarea>

<br>

<button onclick="convert()">Convert to Retain</button>
<button onclick="copyOutput()">Copy Output</button>
<button onclick="clearAll()">Clear</button>

<div id="status"></div>

<table id="outputTable">
<thead>
<tr>
<th>Product ID</th>
<th>SAP</th>
<th>Lot#</th>
<th>Expiration Date</th>
<th>Retain Date</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const COL_PRODUCT = 0;
const COL_SAP = 2;
const COL_LOT = 3;
const COL_EXP = 4;

let outputText = "";

function addSixMonths(dateString) {

    const parts = dateString.split("-");

    if (parts.length !== 3) return "";

    const year = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10);
    const day = parseInt(parts[2], 10);

    const targetMonth = month + 6;

    const targetYear = year + Math.floor((targetMonth - 1) / 12);
    const finalMonth = ((targetMonth - 1) % 12) + 1;

    // Find the last day of the destination month
    const lastDay = new Date(targetYear, finalMonth, 0).getDate();

    // Clamp the original day to the last day of the destination month
    const finalDay = Math.min(day, lastDay);

    return `${targetYear}-${String(finalMonth).padStart(2,"0")}-${String(finalDay).padStart(2,"0")}`;
}

function convert() {

    const input = document.getElementById("input").value.trim();
    const tbody = document.querySelector("#outputTable tbody");

    tbody.innerHTML = "";
    outputText = "";

    if (input === "") {
        document.getElementById("status").textContent = "Nothing to convert.";
        return;
    }

    const rows = input.split(/\r?\n/);

    let converted = 0;
    let skipped = 0;

    rows.forEach(row => {

        if (row.trim() === "") return;

        const cols = row.split("\t");

        // Expecting 9 columns
        if (cols.length < 9) {
            skipped++;
            return;
        }

        const product = cols[COL_PRODUCT];
        const sap = cols[COL_SAP];
        const lot = cols[COL_LOT];
        const exp = cols[COL_EXP];
        const retain = addSixMonths(exp);

        const tr = document.createElement("tr");

        [product, sap, lot, exp, retain].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
        });

        tbody.appendChild(tr);

        outputText +=
`${product}\t${sap}\t${lot}\t${exp}\t${retain}\n`;

        converted++;

    });

    document.getElementById("status").textContent =
        `Converted ${converted} row(s)` +
        (skipped ? ` | Skipped ${skipped} malformed row(s)` : "");

}

function copyOutput() {

    if (outputText === "") {
        alert("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(outputText)
        .then(() => alert("Output copied to clipboard."))
        .catch(() => alert("Unable to copy output."));

}

function clearAll() {

    document.getElementById("input").value = "";
    document.querySelector("#outputTable tbody").innerHTML = "";
    document.getElementById("status").textContent = "";
    outputText = "";

}

</script>

</body>
</html>
